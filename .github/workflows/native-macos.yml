name: Native macOS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # The SwiftUI app reads the renderer's translations and icons, which the
      # resource check below regenerates from node_modules.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install the Rust toolchain
        # rust-toolchain.toml names the version, both Mac targets and the components.
        run: |
          rustup toolchain install || rustup show
          cargo --version

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test libera-core
        run: cargo test --workspace

      - name: Build libera-core for SwiftPM
        run: apps/macos/scripts/build-core.sh

      - name: Check generated resources are up to date
        run: |
          node apps/macos/scripts/sync-resources.mjs
          node apps/macos/scripts/generate-licenses.mjs
          git diff --exit-code apps/macos/Sources/LiberaUI/Resources

      - name: Test the app
        working-directory: apps/macos
        run: swift test

      - name: Build Libera.app
        run: apps/macos/scripts/build-app.sh
        env:
          LIBERA_SKIP_CORE: '1'

      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          name: libera-native-macos
          path: apps/macos/dist/*.dmg
          if-no-files-found: error
          retention-days: 7
