version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # archiver-zip-encrypted, which supplies the encrypted-ZIP format, depends
      # on archiver ^7 and zip-stream ^6. On archiver 8 npm installs a second
      # archiver and registerFormat is not even on the export any more, so the
      # encrypted-ZIP path breaks on import. Revisit when that plugin supports 8.
      - dependency-name: archiver
        update-types: [version-update:semver-major]
      - dependency-name: '@types/archiver'
        update-types: [version-update:semver-major]
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /site
    schedule:
      interval: weekly
