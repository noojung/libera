[workspace]
resolver = "3"
members = ["crates/libera-core", "crates/libera-ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
uniffi = "0.32.2"

[profile.release]
lto = true
codegen-units = 1
